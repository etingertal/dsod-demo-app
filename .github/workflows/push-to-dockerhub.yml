name: Copy image from Artifactory to Docker Hub

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: "Full source image path in Artifactory (e.g. xxx.jfrog.io/docker-repo/gel-test:1.0)"
        required: true
      target_tag:
        description: "Tag to use on Docker Hub"
        required: true
        default: "test"

env:
  ARTIFACTORY_HOST: solengeu.jfrog.io
  TARGET_IMAGE: etingertal/gel-test

jobs:
  copy-image:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Artifactory
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACTORY_HOST }}
          username: ${{ secrets.ARTIFACTORY_USER }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull from Artifactory
        run: docker pull "${{ inputs.source_image }}"

      - name: Re-tag for Docker Hub
        run: docker tag "${{ inputs.source_image }}" "${{ env.TARGET_IMAGE }}:${{ inputs.target_tag }}"

      - name: Push to Docker Hub
        run: docker push "${{ env.TARGET_IMAGE }}:${{ inputs.target_tag }}"
